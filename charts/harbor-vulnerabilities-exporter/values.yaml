---
# nameOverride: ""
# fullnameOverride: ""

replicas: 1
harborApiUrl: 'http://harbor-harbor-harbor-core.harbor/api/v2.0'
exporterPort: 8000

# -- list of project/repositories to ignore (won't create a metric in prometheus)
# ignoreRepositories:
# - project/repo1
# - project/repo2

# -- existing Secret with harbor credentials; if secretName is set, harborUsername and harborPassword are ignored
existingSecret:
  secretName: ""
  usernameKey: username
  passwordKey: password

# -- script won't use credentials if values are empty (only public projects are visible), read-only robot account should be enough
harborUsername: ""
harborPassword: ""

# -- additional environment variables to pass to the container, see https://github.com/NCCloud/harbor-vulnerabilities-exporter#configuration
extraEnv: []
# -- seconds between Harbor crawls, metrics are served from the latest crawl results
# - name: COLLECT_INTERVAL
#   value: "300"
# -- number of threads for exporter script to call Harbor API, 5 by default
# - name: THREADS
#   value: "5"
# -- expose harbor_image_vulnerability metric with one series per vulnerability
# - name: DETAILED_METRICS
#   value: "true"
# -- the lowest severity of harbor_image_vulnerability: Unknown, Low, Medium, High (default) or Critical
# - name: MIN_SEVERITY
#   value: "High"
# -- expose only vulnerabilities with a fix version in harbor_image_vulnerability
# - name: ONLY_FIXABLE
#   value: "true"
# -- expose harbor_vulnerability_info metric with descriptions of vulnerabilities
# - name: INCLUDE_DESCRIPTION
#   value: "true"
# -- maximum number of characters of a description, 0 by default means no limit
# - name: DESCRIPTION_MAX_LENGTH
#   value: "1024"

image:
  repository: ghcr.io/nccloud/harbor-vulnerabilities-exporter
  tag: ""
  pullPolicy: IfNotPresent

# -- resource requests and limits for the exporter container
resources: {}
#  limits:
#    memory: 256Mi
#  requests:
#    cpu: 50m
#    memory: 128Mi

# -- pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- exporter container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# -- the exporter is ready after the first Harbor crawl
readinessProbe:
  httpGet:
    path: /ready
    port: metrics
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

serviceMonitor:
  # -- serviceMonitor can be disabled if needed
  enabled: true
  scrapeTimeout: "30s"
  # -- scrapes are served from cache, keep the interval below Prometheus lookback delta (5m)
  scrapeInterval: "60s"
  # -- fail the scrape if the exporter returns more samples, 0 means no limit
  sampleLimit: 0
